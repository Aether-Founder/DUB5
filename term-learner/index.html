<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Begrippen Leren - DUB5</title>
<meta name="theme-color" content="#0b1150" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --line: rgba(224, 242, 254, 0.16);
    --line-strong: rgba(224, 242, 254, 0.3);
    --ink: rgb(226, 240, 255);
    --ink-dim: rgba(226, 240, 255, 0.6);
    --glass: rgba(9, 13, 38, 0.62);
    --glass-hover: rgba(13, 19, 50, 0.72);
    --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.09);
    --glass-shadow: 0 18px 40px -26px rgba(0, 0, 0, 1);
    --glass-blur: blur(16px) saturate(160%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: radial-gradient(140% 100% at 50% -10%, #0b1150 0%, #050833 42%, #01030f 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .container {
    max-width: 600px;
    text-align: center;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-weight: normal;
    font-size: 3rem;
    margin-bottom: 1rem;
  }
  p {
    color: var(--ink-dim);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    font-size: 15px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    border: 1px solid var(--line);
    background-color: var(--glass);
    color: #fff;
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    transition: all 0.15s ease;
  }
  .btn:hover {
    background-color: var(--glass-hover);
    border-color: var(--line-strong);
  }
  .back-link {
    position: fixed;
    top: 1rem;
    left: 1rem;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 0.84rem;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .back-link:hover {
    color: #fff;
    border-color: var(--line-strong);
    background: var(--glass-hover);
  }
  .status {
    margin-top: 2rem;
    padding: 1rem;
    border-radius: 6px;
    background: var(--glass-hover);
    border: 1px solid var(--line);
    font-size: 0.9rem;
    color: var(--ink-dim);
  }
</style>
</head>
<body>
  <a class="back-link" href="/">← Terug naar DUB5</a>
  
  <div class="container">
    <h1>Begrippen Leren</h1>
    <p>Oefen met termen en definities voor al je schoolvakken. Interactieve flashcards, quizzen en meer.</p>
    
    <div class="status">
      <strong>Dev Server Status:</strong> Start de development server om de app te gebruiken.<br>
      <code style="background: rgba(0,0,0,0.3); padding: 0.2rem 0.4rem; border-radius: 3px; font-family: monospace;">cd term-learner-main/term-learner-main && npm run dev</code>
    </div>
    
    <div style="margin-top: 2rem;">
      <a href="http://localhost:5173" class="btn" target="_blank">Open App op localhost:5173</a>
    </div>
  </div>
</body>
</html>
