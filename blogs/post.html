<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog Post - DUB5</title>
<meta name="theme-color" content="#0b1150" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-hover-transition-duration: 300ms;
    --nav-hover-transition-timing: ease-in-out;

    --line: rgba(224, 242, 254, 0.16);
    --line-strong: rgba(224, 242, 254, 0.3);

    --ink: rgb(226, 240, 255);
    --ink-dim: rgba(226, 240, 255, 0.6);

    --glass: rgba(9, 13, 38, 0.62);
    --glass-hover: rgba(13, 19, 50, 0.72);
    --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.09);
    --glass-shadow: 0 18px 40px -26px rgba(0, 0, 0, 1);
    --glass-blur: blur(16px) saturate(160%);

    --card-radius: 999px;
    --r-panel: 18px;
    --r-chip: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
    scroll-padding-top: 120px;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(140% 100% at 50% -10%, #0b1150 0%, #050833 42%, #01030f 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(42% 34% at 16% 10%, rgba(70, 110, 255, 0.20), transparent 68%),
      radial-gradient(38% 30% at 86% 16%, rgba(150, 80, 255, 0.15), transparent 66%),
      radial-gradient(58% 42% at 52% 108%, rgba(0, 130, 230, 0.18), transparent 72%);
    filter: blur(26px);
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: block;
  }

  /* =========================================================
     TOPBAR
     ========================================================= */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
  }
  .topbar::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    background: rgba(6, 9, 28, 0.55);
    backdrop-filter: blur(18px) saturate(170%);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    border-bottom: 1px solid rgba(224, 242, 254, 0.12);
    box-shadow: 0 24px 50px -40px rgba(0, 0, 0, 1);
    transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .topbar.is-scrolled::before { opacity: 1; }

  .topbar-inner {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0.95rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    transition: padding 420ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .topbar.is-scrolled .topbar-inner {
    padding-top: 0.55rem;
    padding-bottom: 0.55rem;
  }

  .topbar-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    color: #fff;
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .brand-mark {
    position: relative;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
  }
  .brand-canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72px;
    height: 72px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: block;
  }

  .topbar-links {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    margin-left: auto;
  }
  .topbar-links::-webkit-scrollbar { display: none; }

  .topbar-link {
    flex-shrink: 0;
    text-decoration: none;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--ink-dim);
    padding: 0.5rem 0.85rem;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    transition: color 300ms ease;
  }
  .topbar-link:hover,
  .topbar-link:focus-visible {
    color: #fff;
  }

  .container {
    position: relative;
    z-index: 10;
    max-width: 1280px;
    margin: 0 auto;
    padding: 7.5rem 1.5rem 3rem;
    flex: 1;
  }

  .content-wrapper {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 2rem;
  }

  .main-content {
    min-width: 0;
  }

  .sidebar {
    position: sticky;
    top: 2rem;
    align-self: start;
  }

  .breadcrumb {
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    color: var(--ink-dim);
  }

  .breadcrumb a {
    color: var(--ink-dim);
    text-decoration: none;
  }

  .breadcrumb a:hover {
    color: var(--ink);
  }

  .post-header {
    margin-bottom: 2rem;
  }

  .post-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .badge {
    padding: 0.25rem 0.75rem;
    border-radius: var(--r-chip);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .badge-featured {
    background: rgba(250, 204, 21, 0.15);
    color: rgb(250, 204, 21);
    border: 1px solid rgba(250, 204, 21, 0.3);
  }

  .badge-category {
    background: rgba(148, 163, 184, 0.15);
    color: rgb(148, 163, 184);
    border: 1px solid rgba(148, 163, 184, 0.3);
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.5rem;
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 1.25rem;
    color: var(--ink-dim);
    margin-bottom: 1rem;
  }

  .summary {
    font-size: 1rem;
    color: var(--ink-dim);
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .post-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    font-size: 0.9rem;
    color: var(--ink-dim);
  }

  .post-meta-item {
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  .platform-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .platform-tag {
    padding: 0.25rem 0.5rem;
    border-radius: var(--r-chip);
    font-size: 0.75rem;
    border: 1px solid var(--line);
    color: var(--ink-dim);
  }

  .ethical-notice {
    border-radius: var(--r-panel);
    border: 1px solid rgba(251, 191, 36, 0.3);
    background: rgba(251, 191, 36, 0.1);
    padding: 1rem;
    margin-bottom: 2rem;
  }

  .ethical-notice h3 {
    font-size: 1rem;
    margin-bottom: 0.5rem;
    color: rgb(251, 191, 36);
  }

  .ethical-notice p {
    font-size: 0.9rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .quick-facts {
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 1.25rem;
    margin-bottom: 2rem;
  }

  .quick-facts h3 {
    font-size: 1rem;
    margin-bottom: 1rem;
    font-family: 'DM Serif Display', serif;
  }

  .quick-fact {
    margin-bottom: 0.75rem;
  }

  .quick-fact dt {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    margin-bottom: 0.25rem;
  }

  .quick-fact dd {
    font-size: 0.9rem;
    font-weight: 500;
  }

  .toc {
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 1.25rem;
    margin-bottom: 2rem;
  }

  .toc h3 {
    font-size: 1rem;
    margin-bottom: 1rem;
    font-family: 'DM Serif Display', serif;
  }

  .toc ul {
    list-style: none;
  }

  .toc li {
    margin-bottom: 0.5rem;
  }

  .toc a {
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 0.9rem;
    transition: color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
  }

  .toc a:hover, .toc a.active {
    color: var(--ink);
  }

  .toc-drawer-toggle {
    display: none;
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    color: var(--ink);
    font-size: 1.5rem;
    cursor: pointer;
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .toc-drawer {
    position: fixed;
    top: 0;
    right: -320px;
    width: 320px;
    height: 100vh;
    background: rgba(9, 13, 38, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 1001;
    transition: right 0.3s ease;
    padding: 2rem;
    overflow-y: auto;
  }

  .toc-drawer.open {
    right: 0;
  }

  .toc-drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .toc-drawer-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .toc-drawer-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    color: var(--ink);
    font-size: 1.5rem;
    cursor: pointer;
  }

  .section {
    margin-bottom: 2rem;
    scroll-margin-top: 120px;
  }

  .section h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    margin-bottom: 1rem;
  }

  .section h3 {
    font-size: 1.25rem;
    margin-bottom: 0.75rem;
  }

  .section p {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--ink-dim);
    margin-bottom: 1rem;
  }

  .section ul, .section ol {
    margin-left: 1.5rem;
    margin-bottom: 1rem;
    color: var(--ink-dim);
  }

  .section li {
    margin-bottom: 0.5rem;
    line-height: 1.6;
  }

  .section code {
    background: rgba(0, 0, 0, 0.3);
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
  }

  .section pre {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--line);
    border-radius: var(--r-panel);
    padding: 1rem;
    overflow-x: auto;
    margin-bottom: 1rem;
  }

  .section pre code {
    background: none;
    padding: 0;
    border-radius: 0;
    font-size: 0.85rem;
    line-height: 1.5;
  }

  .callout {
    border-radius: var(--r-panel);
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .callout-info {
    border: 1px solid rgba(59, 130, 246, 0.3);
    background: rgba(59, 130, 246, 0.1);
  }

  .callout-warning {
    border: 1px solid rgba(251, 191, 36, 0.3);
    background: rgba(251, 191, 36, 0.1);
  }

  .callout-error {
    border: 1px solid rgba(239, 68, 68, 0.3);
    background: rgba(239, 68, 68, 0.1);
  }

  .callout h3 {
    font-size: 1rem;
    margin-bottom: 0.5rem;
  }

  .callout p {
    font-size: 0.9rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .code-block {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--line);
    border-radius: var(--r-panel);
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
    background: rgba(0, 0, 0, 0.6);
    border-bottom: 1px solid var(--line);
  }

  .code-language {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
  }

  .code-filename {
    font-size: 0.8rem;
    color: var(--ink-dim);
    font-family: 'Courier New', monospace;
  }

  .code-copy {
    padding: 0.25rem 0.75rem;
    border-radius: var(--r-chip);
    font-size: 0.75rem;
    background: rgba(224, 242, 254, 0.1);
    border: 1px solid var(--line);
    color: var(--ink);
    cursor: pointer;
    transition: background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
  }

  .code-copy:hover {
    background: rgba(224, 242, 254, 0.2);
  }

  .code-block pre {
    background: none;
    border: none;
    border-radius: 0;
    padding: 1rem;
    margin: 0;
  }

  .terminal-block {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: var(--r-panel);
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .terminal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
    background: #2d2d2d;
    border-bottom: 1px solid #333;
  }

  .terminal-os {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #ccc;
  }

  .terminal-warning {
    font-size: 0.75rem;
    color: rgb(251, 191, 36);
  }

  .terminal-copy {
    padding: 0.25rem 0.75rem;
    border-radius: var(--r-chip);
    font-size: 0.75rem;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #444;
    color: #fff;
    cursor: pointer;
  }

  .terminal-block pre {
    background: #1e1e1e;
    border: none;
    border-radius: 0;
    padding: 1rem;
    margin: 0;
    color: #d4d4d4;
  }

  .json-viewer {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--line);
    border-radius: var(--r-panel);
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .json-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
    background: rgba(0, 0, 0, 0.6);
    border-bottom: 1px solid var(--line);
  }

  .json-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
  }

  .json-copy, .json-raw {
    padding: 0.25rem 0.75rem;
    border-radius: var(--r-chip);
    font-size: 0.75rem;
    background: rgba(224, 242, 254, 0.1);
    border: 1px solid var(--line);
    color: var(--ink);
    cursor: pointer;
    margin-left: 0.5rem;
  }

  .json-viewer pre {
    background: none;
    border: none;
    border-radius: 0;
    padding: 1rem;
    margin: 0;
    font-size: 0.85rem;
  }

  .image-container {
    margin-bottom: 1rem;
  }

  .image-container img {
    max-width: 100%;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
  }

  .image-caption {
    font-size: 0.85rem;
    color: var(--ink-dim);
    text-align: center;
    margin-top: 0.5rem;
    font-style: italic;
  }

  .video-container {
    margin-bottom: 1rem;
  }

  .video-container video {
    max-width: 100%;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
  }

  .video-caption {
    font-size: 0.85rem;
    color: var(--ink-dim);
    text-align: center;
    margin-top: 0.5rem;
    font-style: italic;
  }

  .file-artifact {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    margin-bottom: 0.75rem;
  }

  .file-icon {
    font-size: 2rem;
  }

  .file-info {
    flex: 1;
  }

  .file-name {
    font-weight: 600;
    margin-bottom: 0.25rem;
  }

  .file-meta {
    display: flex;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--ink-dim);
  }

  .file-description {
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-top: 0.5rem;
  }

  .file-actions {
    display: flex;
    gap: 0.5rem;
  }

  .file-preview, .file-download, .artifact-preview, .artifact-download {
    padding: 0.5rem 1rem;
    border-radius: var(--r-chip);
    font-size: 0.85rem;
    background: rgba(224, 242, 254, 0.1);
    border: 1px solid var(--line);
    color: var(--ink);
    cursor: pointer;
    transition: background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
  }

  .file-preview:hover, .file-download:hover, .artifact-preview:hover, .artifact-download:hover {
    background: rgba(224, 242, 254, 0.2);
  }

  .artifacts-section {
    display: grid;
    gap: 0.75rem;
  }

  .artifact-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }

  .artifact-icon {
    font-size: 2rem;
  }

  .artifact-info {
    flex: 1;
  }

  .artifact-name {
    font-weight: 600;
    margin-bottom: 0.25rem;
  }

  .artifact-meta {
    display: flex;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--ink-dim);
  }

  .artifact-sensitivity {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    border-radius: var(--r-chip);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }

  .artifact-sensitivity-redacted {
    background: rgba(239, 68, 68, 0.15);
    color: rgb(239, 68, 68);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .artifact-sensitivity-sanitized {
    background: rgba(251, 191, 36, 0.15);
    color: rgb(251, 191, 36);
    border: 1px solid rgba(251, 191, 36, 0.3);
  }

  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--ink-dim);
  }

  .error {
    text-align: center;
    padding: 2rem;
    color: rgb(239, 68, 68);
  }

  @media (max-width: 768px) {
    .content-wrapper {
      grid-template-columns: 1fr;
    }
    .sidebar {
      position: static;
      display: none;
    }
    .toc-drawer-toggle {
      display: flex;
    }
    h1 { font-size: 2rem; }
    .container { padding: 6.5rem 1.25rem 2rem; }
    .topbar-inner {
      padding-left: 1.1rem;
      padding-right: 1.1rem;
    }
    .topbar-link { padding: 0.5rem 0.55rem; font-size: 0.82rem; }
  }
</style>
</head>
<body data-layout="three-columns">
<canvas class="stars" id="starfield" aria-hidden="true"></canvas>

<!-- ============ TOPBAR ============ -->
<nav class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <canvas class="brand-canvas" id="navStar"></canvas>
      </span>
      <span>DUB5</span>
    </a>
    <div class="topbar-links">
      <a class="topbar-link" href="/#games">Games</a>
      <a class="topbar-link" href="/#tools">Tools</a>
      <a class="topbar-link" href="/#study">Studie</a>
      <a class="topbar-link" href="/#hacks">Hacks</a>
      <a class="topbar-link" href="/#guides">Uitleg</a>
      <a class="topbar-link" href="/#gallery">Galerij</a>
    </div>
  </div>
</nav>

<main class="container">
  <div class="content-wrapper" id="contentWrapper">
    <div class="loading">Laden...</div>
  </div>

  <button class="toc-drawer-toggle" id="tocToggle" aria-label="Open table of contents">☰</button>
  <div class="toc-drawer-overlay" id="tocOverlay"></div>
  <div class="toc-drawer" id="tocDrawer">
    <button class="toc-drawer-close" id="tocClose">×</button>

<script>
  // Topbar scroll detection
  window.addEventListener('scroll', () => {
    const topbar = document.getElementById('topbar');
    if (window.scrollY > 50) {
      topbar.classList.add('is-scrolled');
    } else {
      topbar.classList.remove('is-scrolled');
    }
  });
</script>
