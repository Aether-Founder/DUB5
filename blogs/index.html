<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blogs - DUB5</title>
<meta name="theme-color" content="#0b1150" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-hover-transition-duration: 300ms;
    --nav-hover-transition-timing: ease-in-out;

    --line: rgba(224, 242, 254, 0.16);
    --line-strong: rgba(224, 242, 254, 0.3);

    --ink: rgb(226, 240, 255);
    --ink-dim: rgba(226, 240, 255, 0.6);

    --glass: rgba(9, 13, 38, 0.62);
    --glass-hover: rgba(13, 19, 50, 0.72);
    --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.09);
    --glass-shadow: 0 18px 40px -26px rgba(0, 0, 0, 1);
    --glass-blur: blur(16px) saturate(160%);

    --card-radius: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
    scroll-padding-top: 110px;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(140% 100% at 50% -10%, #0b1150 0%, #050833 42%, #01030f 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(42% 34% at 16% 10%, rgba(70, 110, 255, 0.20), transparent 68%),
      radial-gradient(38% 30% at 86% 16%, rgba(150, 80, 255, 0.15), transparent 66%),
      radial-gradient(58% 42% at 52% 108%, rgba(0, 130, 230, 0.18), transparent 72%);
    filter: blur(26px);
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: block;
  }

  /* =========================================================
     TOPBAR
     ========================================================= */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
  }
  .topbar::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    background: rgba(6, 9, 28, 0.55);
    backdrop-filter: blur(18px) saturate(170%);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    border-bottom: 1px solid rgba(224, 242, 254, 0.12);
    box-shadow: 0 24px 50px -40px rgba(0, 0, 0, 1);
    transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .topbar.is-scrolled::before { opacity: 1; }

  .topbar-inner {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0.95rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    transition: padding 420ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .topbar.is-scrolled .topbar-inner {
    padding-top: 0.55rem;
    padding-bottom: 0.55rem;
  }

  .topbar-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    color: #fff;
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .brand-mark {
    position: relative;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
  }
  .brand-canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72px;
    height: 72px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: block;
  }

  .topbar-links {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    margin-left: auto;
  }
  .topbar-links::-webkit-scrollbar { display: none; }

  .topbar-link {
    flex-shrink: 0;
    text-decoration: none;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--ink-dim);
    padding: 0.5rem 0.85rem;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    transition: color 300ms ease;
  }
  .topbar-link:hover,
  .topbar-link:focus-visible {
    color: #fff;
  }

  .container {
    position: relative;
    z-index: 10;
    max-width: 1280px;
    margin: 0 auto;
    padding: 7.5rem 1.5rem 3rem;
    flex: 1;
  }

  .header {
    margin-bottom: 3rem;
  }

  .title-wrap {
    font-family: 'DM Serif Display', serif;
    font-size: 6rem;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.03em;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
  }

  .logo-slot {
    position: relative;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
  }

  .logo-canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 192px;
    height: 192px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: block;
  }

  .subline {
    font-size: 1.15rem;
    color: var(--ink-dim);
    line-height: 1.5;
    max-width: 640px;
  }

  .header-rule {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
    margin-top: 2rem;
    opacity: 0;
    transform: scaleX(0);
    animation: headerRuleFadeIn 900ms ease-in-out 480ms forwards;
  }

  @keyframes headerRuleFadeIn {
    0% { opacity: 0; transform: scaleX(0); }
    100% { opacity: 1; transform: scaleX(1); }
  }

  .filters {
    width: 100%;
    max-width: 960px;
    margin-bottom: 2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 0.75rem 1rem;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    color: var(--ink);
    font-size: 0.9rem;
    outline: none;
    transition: border-color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing), background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
  }
  .search-input::placeholder {
    color: var(--ink-dim);
  }
  .search-input:focus {
    border-color: var(--line-strong);
    background: var(--glass-hover);
  }

  .filter-select {
    padding: 0.75rem 1rem;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    color: var(--ink);
    font-size: 0.9rem;
    cursor: pointer;
    outline: none;
    transition: border-color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing), background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
  }
  .filter-select:focus {
    border-color: var(--line-strong);
    background: var(--glass-hover);
  }
  .filter-select option {
    background: #050833;
    color: var(--ink);
  }

  .posts-grid {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .post-card {
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    text-decoration: none;
    color: var(--ink);
    transition: transform var(--nav-hover-transition-duration) var(--nav-hover-transition-timing), border-color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing), background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
  }
  .post-card:hover, .post-card:focus-visible {
    transform: translateY(-2px);
    border-color: var(--line-strong);
    background: var(--glass-hover);
  }

  .post-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .badge {
    padding: 0.25rem 0.75rem;
    border-radius: var(--r-chip);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .badge-featured {
    background: rgba(250, 204, 21, 0.15);
    color: rgb(250, 204, 21);
    border: 1px solid rgba(250, 204, 21, 0.3);
  }
  .badge-category {
    background: rgba(148, 163, 184, 0.15);
    color: rgb(148, 163, 184);
    border: 1px solid rgba(148, 163, 184, 0.3);
  }
  .badge-impact-high {
    background: rgba(239, 68, 68, 0.15);
    color: rgb(239, 68, 68);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  .badge-impact-medium {
    background: rgba(251, 191, 36, 0.15);
    color: rgb(251, 191, 36);
    border: 1px solid rgba(251, 191, 36, 0.3);
  }
  .badge-impact-low {
    background: rgba(34, 197, 94, 0.15);
    color: rgb(34, 197, 94);
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  .post-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 0.25rem;
  }

  .post-summary {
    font-size: 0.9rem;
    color: var(--ink-dim);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .post-meta {
    margin-top: auto;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--ink-dim);
  }

  .post-meta-item {
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  .platform-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .platform-tag {
    padding: 0.25rem 0.5rem;
    border-radius: var(--r-chip);
    font-size: 0.75rem;
    border: 1px solid var(--line);
    color: var(--ink-dim);
  }

  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--ink-dim);
  }

  .error {
    text-align: center;
    padding: 2rem;
    color: rgb(239, 68, 68);
  }

  .empty {
    text-align: center;
    padding: 3rem;
    color: var(--ink-dim);
  }

  @media (max-width: 768px) {
    .title-wrap { font-size: 4.5rem; }
    .container { padding: 6.5rem 1.25rem 2rem; }
    .topbar-inner {
      padding-left: 1.1rem;
      padding-right: 1.1rem;
    }
    .topbar-link { padding: 0.5rem 0.55rem; font-size: 0.82rem; }
    .posts-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-layout="three-columns">
<canvas class="stars" id="starfield" aria-hidden="true"></canvas>

<!-- ============ TOPBAR ============ -->
<nav class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <canvas class="brand-canvas" id="navStar"></canvas>
      </span>
      <span>DUB5</span>
    </a>
    <div class="topbar-links">
      <a class="topbar-link" href="/#games">Games</a>
      <a class="topbar-link" href="/#tools">Tools</a>
      <a class="topbar-link" href="/#study">Studie</a>
      <a class="topbar-link" href="/#hacks">Hacks</a>
      <a class="topbar-link" href="/#guides">Uitleg</a>
      <a class="topbar-link" href="/#gallery">Galerij</a>
    </div>
  </div>
</nav>

<main class="container">
  <header class="header">
    <div class="title-wrap">
      <span class="logo-slot" aria-hidden="true">
        <canvas class="logo-canvas" id="headerStar"></canvas>
      </span>
      <h1>Blogs</h1>
    </div>
    <p class="subline">Technische blogs, diepgaande analyses en onderzoeken over educatieve platforms en systemen.</p>
    <div class="header-rule" aria-hidden="true"></div>
  </header>

  <div class="filters">
    <input type="text" class="search-input" id="searchInput" placeholder="Zoek in blogs...">
    <select class="filter-select" id="categoryFilter">
      <option value="all">Alle categorieën</option>
    </select>
    <select class="filter-select" id="platformFilter">
      <option value="all">Alle platforms</option>
    </select>
    <select class="filter-select" id="topicFilter">
      <option value="all">Alle topics</option>
    </select>
    <select class="filter-select" id="sortFilter">
      <option value="newest">Nieuwste eerst</option>
      <option value="alphabetical">Alfabetisch</option>
      <option value="featured">Uitgelicht eerst</option>
    </select>
  </div>

  <div class="posts-grid" id="postsGrid">
    <div class="loading">Laden...</div>
  </div>
</main>

<script src="/blogs/starfield.js"></script>
<script src="/js/intro.js"></script>
<script src="/blogs/blogs.js"></script>
<script>
  // Topbar scroll detection
  window.addEventListener('scroll', () => {
    const topbar = document.getElementById('topbar');
    if (window.scrollY > 50) {
      topbar.classList.add('is-scrolled');
    } else {
      topbar.classList.remove('is-scrolled');
    }
  });
</script>
</body>
</html>
